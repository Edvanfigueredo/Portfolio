# Publishes the Eleventy build (_site/) to GitHub Pages.
# Manual trigger only. It stops before deploying unless Settings → Pages → Source is
# "GitHub Actions"; with "Deploy from a branch", every push to main would rebuild the
# legacy root site with Jekyll and replace this deployment.
name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require Pages source = GitHub Actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          type=$(gh api "repos/${{ github.repository }}/pages" --jq .build_type)
          echo "Pages build type: $type"
          if [ "$type" != "workflow" ]; then
            echo "::error::Settings → Pages → Source must be 'GitHub Actions' (found '$type'). Not deploying."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
