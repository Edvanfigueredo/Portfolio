# GitHub Pages (Jekyll) safety net while the legacy site is still served from the repository root.
# The new site is built by Eleventy from src/ and must never be processed by Jekyll.
exclude:
  - src
  - content
  - planning
  - scripts
  - node_modules
  - _site
  - package.json
  - package-lock.json
  - eleventy.config.js
  - README.md
  - .github
